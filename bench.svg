<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 354" width="1200" height="354" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".45"/></pattern></defs>
<rect width="1200" height="354" fill="#06040f"/>
<text x="30" y="38" font-family="'Courier New',Consolas,monospace" font-size="16" letter-spacing="5" fill="#a78bfa">MEASURED  ·  numpy  ·  single core  ·  log scale</text>
<text x="30" y="88" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#e8e6e3">autodiff: 2,000 gradients of a 500×4 logistic model</text>
<text x="30" y="106" font-family="'Courier New',Consolas,monospace" font-size="12" fill="#8a8a92">≈4,954 gradients per second</text>
<rect x="680" y="74" width="400" height="22" fill="#0e0b1a"/>
<rect x="680" y="74" width="0" height="22" fill="#7c3aed"><animate attributeName="width" from="0" to="105" dur="1.4s" begin="0.00s" fill="freeze"/></rect>
<text x="1095" y="91" font-family="'Courier New',Consolas,monospace" font-size="16" fill="#a78bfa">0.40 s</text>
<text x="30" y="142" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#e8e6e3">HMC: 4 chains × 800 iterations, logistic regression</text>
<text x="30" y="160" font-family="'Courier New',Consolas,monospace" font-size="12" fill="#8a8a92">min ESS 2164, R̂ 1.001</text>
<rect x="680" y="128" width="400" height="22" fill="#0e0b1a"/>
<rect x="680" y="128" width="0" height="22" fill="#7c3aed"><animate attributeName="width" from="0" to="294" dur="1.4s" begin="0.15s" fill="freeze"/></rect>
<text x="1095" y="145" font-family="'Courier New',Consolas,monospace" font-size="16" fill="#a78bfa">4.94 s</text>
<text x="30" y="196" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#e8e6e3">ADVI: 3,000 Adam steps</text>
<text x="30" y="214" font-family="'Courier New',Consolas,monospace" font-size="12" fill="#8a8a92">mean err 0.055</text>
<rect x="680" y="182" width="400" height="22" fill="#0e0b1a"/>
<rect x="680" y="182" width="0" height="22" fill="#7c3aed"><animate attributeName="width" from="0" to="270" dur="1.4s" begin="0.30s" fill="freeze"/></rect>
<text x="1095" y="199" font-family="'Courier New',Consolas,monospace" font-size="16" fill="#a78bfa">3.56 s</text>
<text x="30" y="250" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#e8e6e3">AIPW + 300-replicate bootstrap, 50,000 units</text>
<text x="30" y="268" font-family="'Courier New',Consolas,monospace" font-size="12" fill="#8a8a92">CI width 0.047</text>
<rect x="680" y="236" width="400" height="22" fill="#0e0b1a"/>
<rect x="680" y="236" width="0" height="22" fill="#7c3aed"><animate attributeName="width" from="0" to="263" dur="1.4s" begin="0.45s" fill="freeze"/></rect>
<text x="1095" y="253" font-family="'Courier New',Consolas,monospace" font-size="16" fill="#a78bfa">3.27 s</text>
<text x="30" y="304" font-family="'Courier New',Consolas,monospace" font-size="15" fill="#e8e6e3">conformal coverage experiment: 1,000 series</text>
<text x="30" y="322" font-family="'Courier New',Consolas,monospace" font-size="12" fill="#8a8a92">coverage 89.8%</text>
<rect x="680" y="290" width="400" height="22" fill="#0e0b1a"/>
<rect x="680" y="290" width="0" height="22" fill="#7c3aed"><animate attributeName="width" from="0" to="268" dur="1.4s" begin="0.60s" fill="freeze"/></rect>
<text x="1095" y="307" font-family="'Courier New',Consolas,monospace" font-size="16" fill="#a78bfa">3.48 s</text>
<rect width="1200" height="354" fill="url(#scan)"/><rect x=".5" y=".5" width="1199" height="353" fill="none" stroke="#7c3aed" stroke-opacity=".4"/></svg>