name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install numpy
      - name: Self-tests (autodiff, HMC vs analytic posterior, causal, conformal coverage)
        run: python sibyl.py --test
      - name: Demo
        run: python sibyl.py demo
